<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/pwa/manifest.webmanifest">
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Pierre">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f4a49">
<title>Meu Pierre</title>
<script>
  // Tema: escuro por padrão; a escolha do botão fica salva neste navegador.
  (function () {
    var t = "dark";
    try { t = localStorage.getItem("tema") || "dark"; } catch (e) {}
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#071817" : "#0f4a49";
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%230f4a49%27/%3E%3Cg transform=%27translate(26 26) scale(.0538)%27%3E%3Crect width=%27262%27 height=%27262%27 rx=%2734%27 fill=%27%23fff%27/%3E%3Crect x=%27315%27 width=%27262%27 height=%27262%27 rx=%2734%27 fill=%27%23fff%27/%3E%3Crect x=%27630%27 width=%27262%27 height=%27262%27 rx=%2734%27 fill=%27%23f28c3b%27/%3E%3Crect y=%27315%27 width=%27262%27 height=%27262%27 rx=%2734%27 fill=%27%23cfe3e0%27/%3E%3Crect y=%27630%27 width=%27262%27 height=%27262%27 rx=%2734%27 fill=%27%239ec7c2%27/%3E%3Crect x=%27315%27 y=%27630%27 width=%27262%27 height=%27262%27 rx=%2734%27 fill=%27%239ec7c2%27/%3E%3Crect x=%27630%27 y=%27630%27 width=%27262%27 height=%27262%27 rx=%2734%27 fill=%27%239ec7c2%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --fundo: #0f4a49; --cartao: #fff; --texto: #0f2e2d; --suave: #6b8583; --campo: #f3f7f6; --linha: #e1eae8;
          --acento: #f28c3b; --erro: #d9534f; color-scheme: light; }
  :root[data-theme="dark"] {
    --fundo: #071817; --cartao: #112c2b; --texto: #eaf3f2; --suave: #8fb0ac; --campo: #173836; --linha: #1f4240;
            --acento: #f59a4e; --erro: #ff7b73; color-scheme: dark;
  }
  /* No computador, tudo em 75% do tamanho (como o zoom de 75% do navegador); no celular, tamanho normal */
  @media (min-width: 761px) { html { zoom: .75; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--fundo); color: var(--texto);
         font: 16px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 400px; background: var(--cartao); border-radius: 32px; padding: 36px 30px; }
  .logo { width: 64px; height: 64px; border-radius: 18px; background: #0f4a49; display: grid; place-items: center; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  p { margin: 6px 0 28px; color: var(--suave); font-size: 16px; font-weight: 500; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  input { width: 100%; height: 52px; padding: 0 16px; border: 1px solid var(--linha); border-radius: 16px;
          background: var(--campo); color: inherit; font: inherit; }
  input:focus { outline: 2px solid var(--acento); outline-offset: 1px; }
  button { width: 100%; height: 54px; margin-top: 18px; border: 0; border-radius: 999px; background: var(--acento);
           color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .erro { color: var(--erro); font-size: 14px; font-weight: 600; margin-top: 14px; min-height: 1em; text-align: center; }
</style>
</head>
<body>
<form method="post" action="/entrar">
  <div class="logo" aria-hidden="true">
    <svg width="34" height="34" viewBox="0 0 892 892" aria-hidden="true"><rect x="0" y="0" width="262" height="262" rx="34" fill="#fff"/><rect x="315" y="0" width="262" height="262" rx="34" fill="#fff"/><rect x="630" y="0" width="262" height="262" rx="34" fill="#f28c3b"/><rect x="0" y="315" width="262" height="262" rx="34" fill="#cfe3e0"/><rect x="0" y="630" width="262" height="262" rx="34" fill="#9ec7c2"/><rect x="315" y="630" width="262" height="262" rx="34" fill="#9ec7c2"/><rect x="630" y="630" width="262" height="262" rx="34" fill="#9ec7c2"/></svg>
  </div>
  <h1>Bem-vindo de volta!</h1>
  <p>Entre para ver suas finanças.</p>
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Entrar</button>
  <div class="erro">{{erro}}</div>
</form>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});</script>
</body>
</html>
