<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#151515">
<title>Meu Pierre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --fundo: #151515; --cartao: #fff; --texto: #151515; --suave: #8b8b90; --campo: #f4f4f5; --linha: #e6e6e8;
          --roxo: #5b54f5; --erro: #e5484d; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --fundo: #050506; --cartao: #1a1a1d; --texto: #f2f2f3; --suave: #9a9aa2; --campo: #232327; --linha: #2c2c31;
            --roxo: #7a74ff; --erro: #ff6b6b; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--fundo); color: var(--texto);
         font: 16px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 400px; background: var(--cartao); border-radius: 32px; padding: 36px 30px; }
  .logo { width: 56px; height: 56px; border-radius: 50%; background: #151515; display: grid; place-items: center; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  p { margin: 6px 0 28px; color: var(--suave); font-size: 16px; font-weight: 500; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  input { width: 100%; height: 52px; padding: 0 16px; border: 1px solid var(--linha); border-radius: 16px;
          background: var(--campo); color: inherit; font: inherit; }
  input:focus { outline: 2px solid var(--roxo); outline-offset: 1px; }
  button { width: 100%; height: 54px; margin-top: 18px; border: 0; border-radius: 999px; background: var(--roxo);
           color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .erro { color: var(--erro); font-size: 14px; font-weight: 600; margin-top: 14px; min-height: 1em; text-align: center; }
</style>
</head>
<body>
<form method="post" action="/entrar">
  <div class="logo" aria-hidden="true">
    <svg width="30" height="30" viewBox="0 0 40 40"><path d="M20 4v14H6" fill="none" stroke="#7a74ff" stroke-width="5" stroke-linecap="round"/><path d="M20 36V22h14" fill="none" stroke="#c9f15c" stroke-width="5" stroke-linecap="round"/></svg>
  </div>
  <h1>Bem-vindo de volta!</h1>
  <p>Entre para ver suas finanças.</p>
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Entrar</button>
  <div class="erro">{{erro}}</div>
</form>
</body>
</html>
